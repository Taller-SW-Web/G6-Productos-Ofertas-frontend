name: Frontend Foundation
on:
  pull_request:
    branches: [castilla, poma, lopez, cueva, taco, vera, master]
  push:
    branches: [castilla, poma, lopez, cueva, taco, vera, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Revision under validation
        run: git rev-parse HEAD > validation-commit.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Validate build modes, lint and Playwright suite
        run: bash scripts/ci/validate-frontend.sh
      - name: Evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: frontend-integration-evidence
          path: |
            validation-commit.txt
            docs/evidencias/
            test-results/
            preview-*.log
          retention-days: 14
