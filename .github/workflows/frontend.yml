name: Integración continua del frontend

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      performance_harness:
        description: Ejecutar benchmark opt-in de pantallas administrativas
        required: false
        type: boolean
        default: false
      baseline_ref:
        description: Ref base para comparación secuencial en el mismo runner
        required: false
        type: string
        default: master
      performance_family:
        description: Familia SPA medida en 100 ciclos después del inventario de rutas
        required: false
        type: choice
        default: all
        options: [all, Combos]

concurrency:
  group: frontend-${{ github.event.pull_request.number || github.ref }}-${{ inputs.performance_harness && github.run_id || 'ci' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || !inputs.performance_harness }}

permissions:
  contents: read

jobs:
  clasificar_cambios:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'workflow_dispatch' || !inputs.performance_harness)
    name: Clasificar alcance de cambios
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      clasificacion: ${{ steps.clasificacion.outputs.clasificacion }}
    steps:
      - name: Obtener código para comparar cambios
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Clasificar cambios con criterio documental estricto
        id: clasificacion
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/clasificar-cambios-ci.mjs

  revision_estilo:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'workflow_dispatch' || !inputs.performance_harness)
    name: Revisión de estilo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener código
        uses: actions/checkout@v7.0.1
      - name: Preparar Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Analizar estilo del código
        run: npm run lint
      - name: Validar comando y entorno del build de Vercel
        run: node --test scripts/build-vercel.test.mjs
      - name: Probar vigencia del despliegue de producción
        run: node --test scripts/verificar-despliegue-vercel.test.mjs scripts/verificar-vigencia-vercel.test.mjs scripts/registrar-estado-vercel.test.mjs scripts/vercel-smoke.test.mjs scripts/verificacion-despliegue-vercel.test.mjs
      - name: Probar clasificación segura de cambios
        run: node --test scripts/clasificar-cambios-ci.test.mjs
      - name: Probar cobertura completa de fragmentos E2E
        run: node --test scripts/ejecutar-e2e-balanceado.test.mjs
      - name: Probar el veredicto del agregador validate
        run: node --test scripts/ci/verificar-resultados.test.mjs
      - name: Probar rechazo de reportes Playwright incompletos
        run: node --test scripts/ci/verify-real-playwright.test.mjs
      - name: Probar permisos de certificados sintéticos
        run: node --test tests/e2e-real/tls-owner.test.mjs
      - name: Probar disparadores Draft y Ready
        run: node --test scripts/ci/draft-ready-policy.test.mjs

  comprobacion_tipos:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'workflow_dispatch' || !inputs.performance_harness)
    name: Comprobación de tipos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener código
        uses: actions/checkout@v7.0.1
      - name: Preparar Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Comprobar tipos de TypeScript
        run: npm run typecheck

  unitarias_combos:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'workflow_dispatch' || !inputs.performance_harness)
    name: Pruebas unitarias - Combos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener código
        uses: actions/checkout@v7.0.1
      - name: Preparar Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas unitarias de Combos
        run: npm run test:unit:combos

  unitarias_carga_masiva:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'workflow_dispatch' || !inputs.performance_harness)
    name: Pruebas unitarias - Carga masiva
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener código
        uses: actions/checkout@v7.0.1
      - name: Preparar Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas unitarias de Carga masiva
        run: npm run test:unit:bulk

  unitarias_inventario:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'workflow_dispatch' || !inputs.performance_harness)
    name: Pruebas unitarias - Inventario
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener código
        uses: actions/checkout@v7.0.1
      - name: Preparar Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas unitarias de Inventario
        run: npm run test:unit:inventory

  unitarias_precios:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'workflow_dispatch' || !inputs.performance_harness)
    name: Pruebas unitarias - Precios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener código
        uses: actions/checkout@v7.0.1
      - name: Preparar Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas unitarias de Precios
        run: npm run test:unit:pricing

  compilacion_demostracion:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'workflow_dispatch' || !inputs.performance_harness)
    name: Compilación - Datos de demostración
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_DATA_MODE: mock
    steps:
      - name: Obtener código
        uses: actions/checkout@v7.0.1
      - name: Preparar Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar interfaz de demostración
        run: npm run build
      - name: Guardar compilación de demostración
        uses: actions/upload-artifact@v7.0.2
        with:
          name: compilacion-demostracion
          path: dist/
          if-no-files-found: error
          retention-days: 1

  compilacion_api:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'workflow_dispatch' || !inputs.performance_harness)
    name: Compilación - Integración con API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_DATA_MODE: api
      VITE_G6_ADMIN_API_ENABLED: 'true'
    steps:
      - name: Obtener código
        uses: actions/checkout@v7.0.1
      - name: Preparar Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Instalar Chromium para la verificación API
        run: npx playwright install --with-deps chromium
      - name: Probar límites del verificador antes de introducir credenciales
        run: npm run test:release:boundary
      - name: Probar panel compilado con G7 y Gateway contractuales aislados (no homologación real)
        run: npm run test:production:auth
      - name: Compilar interfaz para integración con API
        run: npm run build
      - name: Rechazar secretos en el bundle administrativo
        run: node scripts/h5/security/bundle-check.mjs dist
      - name: Verificar compilación API sin retorno a datos de demostración
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 5174 --strictPort > preview-api.log 2>&1 &
          preview_pid=$!
          cleanup() {
            kill "$preview_pid" 2>/dev/null || true
            wait "$preview_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5174/ > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "::error::La vista previa del modo API no respondió a tiempo."
            exit 1
          fi
          node scripts/verify-production.mjs api
      - name: Conservar evidencia de la compilación API
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: evidencia-compilacion-api
          path: |
            preview-api.log
            docs/evidencias/
          if-no-files-found: ignore
          retention-days: 7

  verificacion_compilacion:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'workflow_dispatch' || !inputs.performance_harness)
    name: Verificación de compilación local
    needs: [compilacion_demostracion]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_DATA_MODE: mock
    steps:
      - name: Obtener código
        uses: actions/checkout@v7.0.1
      - name: Preparar Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias de verificación
        run: npm ci
      - name: Instalar Chromium para la vista previa
        run: npx playwright install --with-deps chromium
      - name: Descargar compilación de demostración
        uses: actions/download-artifact@v7.0.0
        with:
          name: compilacion-demostracion
          path: dist/
      - name: Verificar compilación y vista previa de demostración
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 5174 --strictPort > preview-demostracion.log 2>&1 &
          preview_pid=$!
          cleanup() {
            kill "$preview_pid" 2>/dev/null || true
            wait "$preview_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5174/ > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "::error::La vista previa de demostración no respondió a tiempo."
            exit 1
          fi
          node scripts/verify-production.mjs mock
          node scripts/vercel-smoke.mjs http://127.0.0.1:5174
      - name: Conservar evidencia de la compilación local
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: evidencia-compilacion-local
          path: |
            preview-demostracion.log
            docs/evidencias/
          if-no-files-found: ignore
          retention-days: 7

  pruebas_rapidas_interfaz:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'workflow_dispatch' || !inputs.performance_harness)
    name: Pruebas rápidas de interfaz
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_DATA_MODE: mock
      CI: 'true'
    steps:
      - name: Obtener código
        uses: actions/checkout@v7.0.1
      - name: Preparar Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium
      - name: Ejecutar pruebas rápidas de interfaz
        run: npx playwright test --grep '@smoke' --workers=1
      - name: Conservar resultados de pruebas rápidas
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: resultados-pruebas-rapidas
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  comparacion_rendimiento_admin:
    name: Benchmark administrativo base y optimizado (opt-in)
    if: github.event_name == 'workflow_dispatch' && inputs.performance_harness
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      VITE_DATA_MODE: api
    steps:
      - name: Obtener el candidato optimizado
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias del candidato
        run: npm ci
      - name: Instalar Chromium una vez para ambas ejecuciones
        run: npx playwright install --with-deps chromium
      - name: Obtener versión base
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.baseline_ref || 'master' }}
          path: baseline
          persist-credentials: false
      - name: Instalar dependencias de la versión base
        working-directory: baseline
        run: npm ci
      - name: Ejecutar el mismo harness sobre la versión base
        env:
          G6_PERF_APP_ROOT: ${{ github.workspace }}/baseline
          G6_PERF_RUN_LABEL: baseline-${{ inputs.baseline_ref || 'master' }}
          G6_PERF_FAMILY: ${{ inputs.performance_family || 'all' }}
        run: |
          rm -rf baseline/node_modules/.vite
          node scripts/run-admin-performance.mjs
      - name: Guardar evidencia base antes de ejecutar candidato
        if: always()
        run: |
          mkdir -p artifacts/admin-performance-baseline
          cp -R test-results/. artifacts/admin-performance-baseline/ || true
      - name: Ejecutar el mismo harness sobre el candidato optimizado
        id: candidato
        env:
          G6_PERF_APP_ROOT: ${{ github.workspace }}
          G6_PERF_RUN_LABEL: optimized-${{ github.sha }}
          G6_PERF_FAMILY: ${{ inputs.performance_family || 'all' }}
        run: |
          rm -rf baseline
          rm -rf node_modules/.vite
          node scripts/run-admin-performance.mjs
      - name: Guardar evidencia optimizada
        if: always() && steps.candidato.outcome != 'skipped'
        run: |
          mkdir -p artifacts/admin-performance-optimized
          cp -R test-results/. artifacts/admin-performance-optimized/ || true
      - name: Calcular diferencias de percentiles por familia
        if: always()
        run: |
          mkdir -p artifacts
          baseline_report=$(find artifacts/admin-performance-baseline -name admin-browser-performance.json -print -quit 2>/dev/null || true)
          optimized_report=$(find artifacts/admin-performance-optimized -name admin-browser-performance.json -print -quit 2>/dev/null || true)
          if [ -n "$baseline_report" ] && [ -n "$optimized_report" ]; then
            node scripts/compare-admin-performance.mjs artifacts/admin-performance-baseline artifacts/admin-performance-optimized artifacts/admin-performance-comparison.json
          else
            printf '{"schemaVersion":1,"status":"PARTIAL","comparison":"not-produced","baselineReportPresent":%s,"optimizedReportPresent":%s}\n' \
              "$( [ -n "$baseline_report" ] && echo true || echo false )" \
              "$( [ -n "$optimized_report" ] && echo true || echo false )" \
              > artifacts/admin-performance-comparison.json
            echo 'Comparison unavailable; retained any reports and Playwright failure diagnostics.'
          fi
      - name: Conservar mediciones comparables
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: benchmark-admin-${{ inputs.baseline_ref || 'master' }}-vs-${{ github.sha }}
          path: |
            artifacts/admin-performance-baseline/
            artifacts/admin-performance-optimized/
            artifacts/admin-performance-comparison.json
          if-no-files-found: ignore
          retention-days: 30

  pruebas_extremo_a_extremo:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && ((github.event_name != 'workflow_dispatch' || !inputs.performance_harness) && always() && (needs.clasificar_cambios.result != 'success' || needs.clasificar_cambios.outputs.clasificacion != 'solo_documentacion'))
    name: Pruebas de extremo a extremo (parte ${{ matrix.parte }} de 4)
    needs: [clasificar_cambios]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_DATA_MODE: mock
      CI: 'true'
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3, 4]
    steps:
      - name: Obtener código
        uses: actions/checkout@v7.0.1
      - name: Preparar Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium
      - name: Ejecutar pruebas de extremo a extremo
        run: node scripts/ejecutar-e2e-balanceado.mjs ${{ matrix.parte }} 4
      - name: Conservar resultados de extremo a extremo
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: resultados-extremo-a-extremo-parte-${{ matrix.parte }}
          path: |
            blob-report/
            test-results/
            playwright-report/
            docs/evidencias/
          if-no-files-found: ignore
          retention-days: 7

  unitarias_taxonomy:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name != 'workflow_dispatch' || !inputs.performance_harness)
    name: Pruebas unitarias - Taxonomy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:unit:taxonomy

  politica_release:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name != 'workflow_dispatch' || !inputs.performance_harness)
    name: Política de release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:release:policy

  e2e_pricing:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name != 'workflow_dispatch' || !inputs.performance_harness)
    name: E2E Pricing (configuración propia)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_DATA_MODE: mock
      CI: 'true'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:pricing -- --reporter=line
      - name: Conservar evidencia E2E Pricing
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: resultados-e2e-pricing-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  seguridad_dependencias:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name != 'workflow_dispatch' || !inputs.performance_harness)
    name: Auditoría de dependencias High/Critical
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Probar el verificador fail-closed de auditoría
        run: node --test scripts/ci/verificar-auditoria-dependencias.test.mjs
      - name: Auditar dependencias sin excepciones vencidas
        id: dependency_audit
        env:
          G6_AUDIT_EVIDENCE_DIR: ${{ runner.temp }}/dependency-audit-evidence
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          ACTIONS_RUN_ID: ${{ github.run_id }}
        run: node scripts/ci/verificar-auditoria-dependencias.mjs
      - name: Verificar informe SCA H5 sin repetir npm audit
        if: always() && steps.dependency_audit.outcome != 'skipped'
        run: node scripts/h5/security/sca-audit.mjs "$RUNNER_TEMP/dependency-audit-evidence/dependency-audit.json" "$RUNNER_TEMP/dependency-audit-evidence/dependency-audit-decision.json"
      - name: Conservar informes completos, decisión y SHA auditado
        if: always() && steps.dependency_audit.outcome != 'skipped'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dependency-audit-${{ github.sha }}
          path: ${{ runner.temp }}/dependency-audit-evidence/
          if-no-files-found: error
          retention-days: 30

  seguridad_secretos:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name != 'workflow_dispatch' || !inputs.performance_harness)
    uses: ./.github/workflows/gitleaks.yml

  api_real_aislada:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name != 'workflow_dispatch' || !inputs.performance_harness)
    name: API real aislada con PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Obtener frontend candidato
        uses: actions/checkout@v7.0.1
        with:
          path: frontend
      - name: Obtener backend candidato H5
        uses: actions/checkout@v7.0.1
        with:
          repository: Taller-SW-Web/G6-Productos-Ofertas-backend
          ref: 7d0f04b09b34632751695bc14e6dc5c79c42e632
          path: backend
          persist-credentials: false
      - name: Obtener contratos vigentes
        uses: actions/checkout@v7.0.1
        with:
          repository: Taller-SW-Web/G6-Productos-Ofertas-docs
          ref: 5f30802129ba4bbc0674dcc5878f10065f443118
          path: docs
          persist-credentials: false
      - name: Registrar revisiones efectivas
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C ../backend rev-parse HEAD)" = '7d0f04b09b34632751695bc14e6dc5c79c42e632'
          test "$(git -C ../docs rev-parse HEAD)" = '5f30802129ba4bbc0674dcc5878f10065f443118'
          printf 'frontend=%s\nbackend=%s\ndocs=%s\n' "$(git rev-parse HEAD)" "$(git -C ../backend rev-parse HEAD)" "$(git -C ../docs rev-parse HEAD)" | tee "$RUNNER_TEMP/real-stack-revisions.txt"
          cat "$RUNNER_TEMP/real-stack-revisions.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Preparar Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar frontend y Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Compilar backend candidato
        working-directory: backend
        run: |
          npm ci
          npm run build:all
      - name: Ejecutar flujos reales aislados
        env:
          VITE_DATA_MODE: api
          VITE_G6_ADMIN_API_ENABLED: 'true'
        run: npx playwright test --config playwright.real.config.ts
      - name: Exigir escenarios reales ejecutados
        run: node scripts/ci/verify-real-playwright.mjs test-results/real-stack-results.json
      - name: Conservar evidencia real y revisiones
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: api-real-${{ github.sha }}
          path: |
            frontend/test-results/real-stack-results.json
            frontend/test-results/**/*.zip
            ${{ runner.temp }}/real-stack-revisions.txt
          if-no-files-found: warn

  validacion_integral:
    # La protección real de master exige el contexto de GitHub Actions `validate`.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (always() && (github.event_name != 'workflow_dispatch' || !inputs.performance_harness))
    name: validate
    needs:
      - revision_estilo
      - clasificar_cambios
      - comprobacion_tipos
      - unitarias_combos
      - unitarias_carga_masiva
      - unitarias_inventario
      - unitarias_precios
      - compilacion_demostracion
      - compilacion_api
      - verificacion_compilacion
      - pruebas_rapidas_interfaz
      - pruebas_extremo_a_extremo
      - unitarias_taxonomy
      - politica_release
      - e2e_pricing
      - seguridad_dependencias
      - seguridad_secretos
      - api_real_aislada
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtener el código evaluado
        uses: actions/checkout@v7.0.1
      - name: Preparar Node.js para el verificador
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Verificar resultados obligatorios y clasificación documental
        env:
          RESULTADOS: ${{ toJSON(needs) }}
        run: node scripts/ci/verificar-resultados.mjs "$RESULTADOS"
